name: Quago Technologies LTD
description: >-
  Quago Technologies is a gaming analytics and fraud-detection company that uses machine learning
  and mobile device sensor data to protect and optimize mobile games. Its platform analyzes in-game
  behavioral and device-sensor patterns - without collecting personally identifiable information - to
  detect and manage cheating, identify user-acquisition (CPA) fraud, predict player churn, and optimize
  monetization and lifetime value. Quago is delivered to mobile game studios as an embedded SDK plus a
  backend analytics service rather than a public developer API; it was surfaced as an a16z portfolio
  company and added to the API Evangelist network.
